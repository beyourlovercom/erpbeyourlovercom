name: ERP Order Trash V1 Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Modules/Orders/**'
      - 'database/migrations/*order*'
      - 'resources/js/Pages/Orders/**'
      - 'tests/Feature/Orders/**'
      - 'docs/10_Planning_Roadmap/ERP_ORDER_TRASH_R5_RELEASE_GATE_2026-10-27.md'
      - '.github/workflows/erp-order-trash-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order-trash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund
          ln -s Pages resources/js/pages
      - name: Build frontend for Inertia assertions
        run: npm run build
      - name: Isolated migrations
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --force
      - name: Trash authorization and lifecycle tests
        run: php artisan test tests/Feature/Orders/OrderTrashV1Test.php
      - name: Vue editor visibility and confirmation tests
        run: npx vitest run resources/js/Pages/Orders/Show.test.ts
      - name: Frontend build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD

  mysql8-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_order_trash_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      BYL_ORDER_TRASH_ROLLBACK_CI: '1'
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: erp_order_trash_ci
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_URL: ''
      ERP_LOCAL_ADMIN_BYPASS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated MySQL migrations
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force
      - name: Refuse rollback with trashed rows, clean rollback, reapply
        run: php tests/Feature/Orders/support/order-trash-mysql-rollback.php
