name: ERP KOL Mobile Browser UAT (Disposable)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'resources/js/Pages/Orders/KolLogistics.vue'
      - 'resources/js/Components/Products/SkuCombobox.vue'
      - 'app/Modules/Orders/**'
      - 'app/Modules/Products/**'
      - 'menu/APPROVED_MENU.json'
      - '.github/workflows/erp-kol-mobile-browser-uat.yml'

permissions:
  contents: read

jobs:
  synthetic-m14-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund
      - name: Install isolated Chromium outside repository
        run: |
          browser_path="${RUNNER_TEMP}/byl-playwright/1.62.1"
          mkdir -p "$browser_path"
          echo "PLAYWRIGHT_BROWSERS_PATH=$browser_path" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$browser_path" ./node_modules/.bin/playwright install --with-deps chromium
      - name: Validate E2E types and disposable safety contracts
        run: |
          npm run typecheck:e2e
          npm run test:e2e:contracts
      - name: Run complete synthetic loopback browser UAT
        env:
          BYL_E2E_BROWSER: ''
        run: npm run test:e2e
      - name: Ensure no unmanaged test fixtures persisted
        if: always()
        run: |
          test ! -e .env
          test ! -e database/e2e.sqlite
