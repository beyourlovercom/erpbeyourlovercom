name: ERP MorePlus Per-Order Isolation R8 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Modules/Logistics/Application/ShipOut/**'
      - 'app/Modules/Logistics/Infrastructure/ShipOut/**'
      - 'app/Modules/Logistics/Experience/Jobs/*ShipOut*'
      - 'app/Modules/Logistics/Experience/Controllers/OverseaWarehouseController.php'
      - 'config/shipout.php'
      - 'resources/js/Pages/Logistics/Oversea/Show.vue'
      - 'resources/js/Pages/Logistics/Oversea/Show.test.ts'
      - 'tests/Feature/Logistics/ShipOut*Test.php'
      - 'tests/Feature/Logistics/OverseaWarehouseWorkbenchTest.php'
      - '.github/workflows/erp-moreplus-batch-isolation-r8.yml'

permissions:
  contents: read

jobs:
  isolated-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify MorePlus exact allowlist, per-order quarantine and no duplicate POST
        run: |
          php artisan test tests/Feature/Logistics/ShipOutProductionBatchTest.php tests/Feature/Logistics/ShipOutProductionCanaryDispatchServiceTest.php --no-ansi
          php artisan test tests/Feature/Logistics/OverseaWarehouseWorkbenchTest.php --no-ansi
      - name: Verify changed application code style
        run: |
          vendor/bin/pint --test config/shipout.php app/Modules/Logistics/Application/ShipOut/ShipOutProductionBatchService.php app/Modules/Logistics/Application/ShipOut/ShipOutProductionDispatchState.php app/Modules/Logistics/Experience/Jobs/ProcessShipOutProductionBatch.php app/Modules/Logistics/Experience/Jobs/VerifyShipOutProductionBatchItem.php app/Modules/Logistics/Experience/Controllers/OverseaWarehouseController.php tests/Feature/Logistics/ShipOutProductionBatchTest.php tests/Feature/Logistics/ShipOutProductionCanaryDispatchServiceTest.php

  isolated-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify MorePlus per-order exception UI and ACK status
        run: npx vitest run resources/js/Pages/Logistics/Oversea/Show.test.ts
      - name: Verify production UI bundle
        run: npm run build
